<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-new" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728"/>
      <stop offset="50%" stop-color="#091c28"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>
    <linearGradient id="primary-glow-new" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold-grad-new" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="halo-new" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-filter-new" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-new)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle ambient halo -->
  <circle cx="256" cy="240" r="160" fill="url(#halo-new)"/>

  <!-- Geometric 8-point Islamic Star / Arch background motif -->
  <g opacity="0.15" stroke="#38ef7d" stroke-width="1.5" fill="none">
    <rect x="176" y="176" width="160" height="160" rx="12"/>
    <rect x="176" y="176" width="160" height="160" rx="12" transform="rotate(45 256 256)"/>
  </g>

  <!-- Stylized Crescent Moon (Hilal) -->
  <path d="M 275 140 C 220 145 178 190 178 248 C 178 312 230 364 294 364 C 326 364 354 351 374 330 C 314 340 260 292 260 230 C 260 188 282 155 315 142 C 302 140 288 139 275 140 Z" fill="url(#primary-glow-new)" filter="url(#glow-filter-new)"/>

  <!-- Elegant Modern Islamic Mosque without Dome (Iwan Portal, Minarets, Geometric Arches) -->
  <g fill="url(#gold-grad-new)">
    <!-- Main building / Flat modern pavilion block -->
    <rect x="228" y="278" width="56" height="62" rx="2"/>
    <!-- Grand Rectangular Portal / Peshtak (traditional high entrance frame) -->
    <rect x="236" y="260" width="40" height="80" rx="2"/>
    <!-- Deep Islamic Arch niche cutout inside portal -->
    <path d="M 242 340 L 242 284 C 242 272 270 272 270 284 L 270 340 Z" fill="#0b1728"/>
    <!-- Glowing internal sacred gate light -->
    <rect x="253" y="318" width="6" height="22" rx="3" fill="url(#gold-grad-new)"/>

    <!-- Left Minaret (modern geometric faceted tower) -->
    <rect x="208" y="250" width="8" height="90" rx="2"/>
    <!-- Minaret Balcony -->
    <rect x="206" y="270" width="12" height="3" rx="1.5" fill="#fef08a"/>
    <polygon points="204,250 220,250 212,234"/>
    <circle cx="212" cy="230" r="2.5" fill="#fef08a"/>
    <rect x="210" y="286" width="4" height="8" rx="2" fill="#0b1728"/>

    <!-- Right Minaret -->
    <rect x="296" y="258" width="7" height="82" rx="2"/>
    <rect x="294.5" y="276" width="10" height="3" rx="1.5" fill="#fef08a"/>
    <polygon points="293,258 306,258 299.5,244"/>
    <circle cx="299.5" cy="241" r="2" fill="#fef08a"/>
  </g>

  <!-- Stars -->
  <g transform="translate(345, 175)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#gold-grad-new)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>
  <g transform="translate(180, 205) scale(0.6)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#38ef7d" opacity="0.8"/>
  </g>
</svg>